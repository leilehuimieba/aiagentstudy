<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知识图谱 — AI Agent 情报站</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

  .topbar { padding: 14px 24px; border-bottom: 1px solid #1e2535;
            display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .topbar h1 { font-size: 16px; font-weight: 600; color: #fff; }
  .topbar a  { font-size: 13px; color: #3b82f6; text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }

  .layout { display: grid; grid-template-columns: 1fr 280px; flex: 1; overflow: hidden; min-height: 0; }

  #cy { background: #0a0d14; }

  .sidebar { border-left: 1px solid #1e2535; overflow-y: auto; padding: 20px 16px; }
  .sidebar h2 { font-size: 12px; color: #64748b; text-transform: uppercase;
                letter-spacing: .06em; margin-bottom: 12px; font-weight: 600; }

  .legend { margin-bottom: 22px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px;
                color: #94a3b8; margin-bottom: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .topic-list { margin-bottom: 22px; }
  .topic-item { padding: 9px 10px; border-radius: 7px; margin-bottom: 5px;
                cursor: pointer; transition: background .15s; }
  .topic-item:hover { background: #1a2035; }
  .topic-item.selected { background: #1e3a5f; }
  .topic-item .name { font-size: 13px; color: #e2e8f0; margin-bottom: 5px; }
  .topic-item .bar-wrap { background: #1a2035; border-radius: 3px; height: 3px; }
  .topic-item .bar { border-radius: 3px; height: 3px; transition: width .3s; }
  .topic-item .meta { font-size: 11px; color: #64748b; margin-top: 4px;
                      display: flex; justify-content: space-between; }

  .detail-box { background: #1a2035; border-radius: 10px; padding: 14px;
                font-size: 13px; display: none; margin-bottom: 20px; }
  .detail-box.show { display: block; }
  .detail-box h3 { font-size: 14px; color: #fff; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between;
                padding: 6px 0; border-bottom: 1px solid #1e2535; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .lbl { color: #64748b; }
  .detail-row .val { color: #e2e8f0; font-weight: 500; }

  .rec-card { background: #1a2035; border-radius: 7px; padding: 11px 12px;
              margin-bottom: 8px; border-left: 3px solid #3b82f6; }
  .rec-title { font-size: 13px; color: #e2e8f0; margin-bottom: 5px;
               line-height: 1.4; cursor: pointer; }
  .rec-title:hover { color: #3b82f6; }
  .rec-meta { font-size: 11px; color: #38bdf8; margin-bottom: 3px; }
  .rec-reason { font-size: 11px; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>

<div class="topbar">
  <h1>知识图谱</h1>
  <a href="/">← 返回首页</a>
  <span style="flex:1"></span>
  <span id="graph-summary" style="font-size:12px;color:#64748b"></span>
</div>

<div class="layout">
  <div id="cy"></div>

  <div class="sidebar">
    <div class="legend">
      <h2>图例</h2>
      <div class="legend-row">
        <div class="legend-dot" style="background:#22c55e"></div>
        <span>覆盖率 ≥ 50%</span>
      </div>
      <div class="legend-row">
        <div class="legend-dot" style="background:#f59e0b"></div>
        <span>覆盖率 20–50%</span>
      </div>
      <div class="legend-row">
        <div class="legend-dot" style="background:#ef4444"></div>
        <span>覆盖率 &lt; 20%（待补强）</span>
      </div>
      <div class="legend-row" style="margin-top:4px">
        <div style="width:24px;height:2px;background:#334155;flex-shrink:0"></div>
        <span>话题间 tag 共现</span>
      </div>
    </div>

    <div class="topic-list">
      <h2>话题覆盖</h2>
      <div id="topic-list"></div>
    </div>

    <div class="detail-box" id="detail-box">
      <h3 id="detail-name"></h3>
      <div class="detail-row"><span class="lbl">总文章数</span><span class="val" id="detail-total"></span></div>
      <div class="detail-row"><span class="lbl">已读</span><span class="val" id="detail-read"></span></div>
      <div class="detail-row"><span class="lbl">覆盖率</span><span class="val" id="detail-cov"></span></div>
    </div>

    <div>
      <h2>推荐阅读</h2>
      <div id="rec-list"><div style="font-size:12px;color:#475569;padding:8px 0">加载中…</div></div>
    </div>
  </div>
</div>

<script>
function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function covColor(pct) {
  if (pct >= 50) return "#22c55e";
  if (pct >= 20) return "#f59e0b";
  return "#ef4444";
}

let _cy = null;

function showDetail(d) {
  document.getElementById("detail-box").classList.add("show");
  document.getElementById("detail-name").textContent  = d.label || d.id;
  document.getElementById("detail-total").textContent = d.total + " 篇";
  document.getElementById("detail-read").textContent  = d.read  + " 篇";
  document.getElementById("detail-cov").textContent   = d.cov_pct + "%";
}

function highlightTopic(topicId) {
  document.querySelectorAll(".topic-item").forEach(el =>
    el.classList.toggle("selected", el.dataset.id === topicId)
  );
  if (_cy) {
    _cy.$("node").deselect();
    _cy.$(`node[id="${topicId}"]`).select();
  }
}

async function loadGraph() {
  const r    = await fetch("/api/graph");
  const json = await r.json();
  if (!json.ok) return;
  const { nodes, edges, topic_stats } = json.data;

  document.getElementById("graph-summary").textContent =
    `${nodes.length} 个话题节点 · ${edges.length} 条关联边`;

  // ── Cytoscape ──────────────────────────────────────────────
  _cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [
      ...nodes.map(n => ({ data: { ...n.data, color: covColor(n.data.cov_pct) } })),
      ...edges,
    ],
    layout: { name: "cose", nodeRepulsion: 10000, idealEdgeLength: 140, animate: false },
    style: [
      {
        selector: "node",
        style: {
          "label":            "data(label)",
          "width":            "data(size)",
          "height":           "data(size)",
          "background-color": "data(color)",
          "color":            "#fff",
          "font-size":        11,
          "text-valign":      "center",
          "text-halign":      "center",
          "text-wrap":        "wrap",
          "text-max-width":   64,
          "border-width":     2,
          "border-color":     "#1e2535",
        }
      },
      { selector: "node:selected", style: { "border-color": "#fff", "border-width": 3 } },
      {
        selector: "edge",
        style: {
          "width":       "mapData(weight, 1, 15, 1, 4)",
          "line-color":  "#334155",
          "curve-style": "bezier",
          "opacity":     0.55,
        }
      },
      { selector: "edge:selected", style: { "line-color": "#3b82f6", "opacity": 1 } },
    ]
  });

  _cy.on("tap", "node", evt => {
    const d = evt.target.data();
    showDetail(d);
    highlightTopic(d.id);
  });

  _cy.on("tap", evt => {
    if (evt.target === _cy) {
      document.getElementById("detail-box").classList.remove("show");
      document.querySelectorAll(".topic-item").forEach(el => el.classList.remove("selected"));
    }
  });

  // ── 侧边栏话题列表 ─────────────────────────────────────────
  const listEl = document.getElementById("topic-list");
  topic_stats.forEach(s => {
    const color = covColor(s.cov_pct);
    const item  = document.createElement("div");
    item.className   = "topic-item";
    item.dataset.id  = s.topic;
    item.innerHTML = `
      <div class="name">${esc(s.name || s.topic)}</div>
      <div class="bar-wrap"><div class="bar" style="width:${s.cov_pct}%;background:${color}"></div></div>
      <div class="meta"><span>${s.read}/${s.total} 篇</span><span>${s.cov_pct}%</span></div>`;
    item.addEventListener("click", () => {
      const node = _cy && _cy.$(`node[id="${s.topic}"]`);
      showDetail({ id: s.topic, label: s.name || s.topic, total: s.total, read: s.read, cov_pct: s.cov_pct });
      highlightTopic(s.topic);
    });
    listEl.appendChild(item);
  });

  loadRecommendations();
}

async function loadRecommendations() {
  const listEl = document.getElementById("rec-list");
  try {
    const r = await fetch("/api/recommendations?n=3");
    const j = await r.json();
    if (!j.ok || !j.data.recommendations || !j.data.recommendations.length) {
      listEl.innerHTML = '<div style="font-size:12px;color:#475569;padding:8px 0">暂无推荐</div>';
      return;
    }
    listEl.innerHTML = j.data.recommendations.map(rec => `
      <div class="rec-card">
        <div class="rec-meta">${esc(rec.date)} · ${esc(rec.topic)}</div>
        <div class="rec-title" data-id="${esc(rec.id)}" data-url="${esc(rec.url || '')}">${esc(rec.title)}</div>
        <div class="rec-reason">${esc(rec.reason)}</div>
      </div>`).join("");

    listEl.querySelectorAll(".rec-title").forEach(el => {
      el.addEventListener("click", () => {
        const url = el.dataset.url;
        if (url) {
          window.open(url, "_blank");
        } else {
          sessionStorage.setItem("selectArticle", el.dataset.id);
          window.location.href = "/";
        }
      });
    });
  } catch(e) {
    listEl.innerHTML = `<div style="font-size:12px;color:#ef4444;padding:8px 0">加载失败</div>`;
  }
}

loadGraph();
</script>
</body>
</html>
